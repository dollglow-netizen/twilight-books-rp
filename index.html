<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twilight: The Story</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#120f11;
  --panel:#1c1719;
  --panel2:#241e21;
  --panel3:#30282b;
  --text:#f4edf0;
  --muted:#aaa0a5;
  --accent:#bda9b2;
  --accent2:#e1d2d8;
  --danger:#9d626c;
  --border:rgba(255,255,255,.10);
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at top,#33282e 0,#120f11 42%);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}

body{
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{display:none!important}

.app{
  min-height:100vh;
}

.screen{
  min-height:100vh;
  padding:24px;
}

.center{
  max-width:1100px;
  margin:auto;
}

.card{
  background:rgba(28,23,25,.94);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
}

button.primary,
button.secondary,
button.danger,
button.ghost{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 18px;
  color:var(--text);
  transition:.2s;
}

button.primary{
  background:var(--accent);
  color:#171214;
  border-color:transparent;
}

button.secondary{
  background:var(--panel3);
}

button.ghost{
  background:transparent;
}

button.danger{
  background:#5d3038;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

input,textarea,select{
  width:100%;
  background:#151214;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
}

label{
  display:block;
  color:var(--muted);
  margin-bottom:7px;
  font-size:.9rem;
}

h1,h2,h3{
  margin-top:0;
}

.muted{
  color:var(--muted);
}

.home{
  display:flex;
  align-items:center;
  justify-content:center;
}

.home-card{
  width:min(720px,100%);
  padding:48px;
  text-align:center;
}

.logo{
  font-size:clamp(2.5rem,7vw,5.5rem);
  letter-spacing:.08em;
  font-weight:normal;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-style:italic;
  margin-bottom:38px;
}

.home-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.auth{
  width:min(430px,100%);
  margin:auto;
  padding:28px;
}

.auth-tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.auth-tabs button{
  flex:1;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}

.field{
  margin-bottom:16px;
}

.topbar{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.topbar-title{
  font-size:1.6rem;
}

.oc-layout{
  max-width:1250px;
  margin:auto;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:18px;
}

.oc-nav{
  padding:14px;
  position:sticky;
  top:20px;
  height:max-content;
}

.oc-nav button{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:var(--muted);
  border:0;
  padding:13px;
  border-radius:10px;
  margin-bottom:3px;
}

.oc-nav button.active{
  background:var(--panel3);
  color:var(--text);
}

.oc-content{
  padding:26px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.section-title{
  margin-bottom:5px;
}

.section-description{
  color:var(--muted);
  margin-top:0;
  margin-bottom:25px;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px;
}

.option{
  padding:13px;
  border:1px solid var(--border);
  background:#171315;
  color:var(--text);
  border-radius:11px;
  text-align:left;
}

.option.selected{
  border-color:var(--accent);
  background:#30282b;
}

.option small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}

.species-card{
  padding:18px;
  margin-bottom:15px;
  background:#171315;
  border:1px solid var(--border);
  border-radius:14px;
}

.species-card h3{
  margin-bottom:5px;
}

.family-info{
  background:#171315;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-top:16px;
  color:var(--muted);
  line-height:1.6;
}

.pet-box{
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  background:#171315;
}

.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px;
  background:#171315;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:18px;
}

.toggle input{
  width:20px;
  height:20px;
}

.creator-footer{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid var(--border);
}

.review{
  background:#151214;
  padding:20px;
  border-radius:14px;
  line-height:1.65;
}

.save-list{
  display:grid;
  gap:12px;
}

.save-card{
  padding:18px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.save-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.rp-layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:290px minmax(0,1fr);
}

.rp-sidebar{
  background:#151214;
  border-right:1px solid var(--border);
  padding:20px;
  overflow:auto;
}

.sidebar-section{
  margin-bottom:25px;
}

.sidebar-title{
  color:var(--muted);
  font-size:.78rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:9px;
}

.sidebar-value{
  line-height:1.5;
  white-space:pre-wrap;
}

.rp-main{
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.rp-header{
  padding:16px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(18,15,17,.92);
  backdrop-filter:blur(12px);
  position:sticky;
  top:0;
  z-index:5;
}

.mobile-menu{
  display:none;
}

.conversation{
  flex:1;
  width:min(950px,100%);
  margin:auto;
  padding:30px 22px 170px;
}

.message{
  margin-bottom:25px;
}

.message-role{
  color:var(--muted);
  font-size:.76rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:7px;
}

.message-body{
  line-height:1.75;
  white-space:pre-wrap;
}

.message.player .message-body{
  background:#262023;
  border-left:3px solid var(--accent);
  padding:13px 16px;
  border-radius:4px 12px 12px 4px;
}

.composer{
  position:fixed;
  bottom:0;
  left:290px;
  right:0;
  background:linear-gradient(transparent,#120f11 20%);
  padding:25px 22px 18px;
  z-index:4;
}

.composer-inner{
  width:min(950px,100%);
  margin:auto;
}

.composer textarea{
  min-height:95px;
  max-height:220px;
  background:#1b1719;
  box-shadow:0 8px 35px rgba(0,0,0,.35);
}

.composer-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:9px;
}

.word-count{
  color:var(--muted);
  margin-left:auto;
  font-size:.82rem;
}

.loading{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{opacity:.25}
  to{opacity:1}
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(750px,100%);
  max-height:90vh;
  overflow:auto;
  padding:25px;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#292326;
  border:1px solid var(--border);
  padding:12px 18px;
  border-radius:10px;
  z-index:200;
  box-shadow:var(--shadow);
}

@media(max-width:850px){
  .screen{
    padding:12px;
  }

  .home-card{
    padding:28px 20px;
  }

  .home-actions{
    grid-template-columns:1fr;
  }

  .oc-layout{
    grid-template-columns:1fr;
  }

  .oc-nav{

  .oc-nav{
    display:flex;
    overflow-x:auto;
    gap:5px;

    width:auto;

  .rp-layout{

  .mobile-menu{

  .composer{

  .conversation{

  .rp-header{

  .form-row{
    grid-template-columns:1fr;

  .creator-footer{
    position:sticky;
    bottom:0;
    background:#1c1719;

    margin-right:-26px;
    padding:12px 20px;
    z-index:5;

@media(max-width:500px){
  .oc-content{
    padding:18px;

  .option-grid{
    grid-template-columns:1fr 1fr;
  }

  .composer-actions button{
    flex:1;
  }

  .word-count{
    width:100%;
    margin-left:0;
    text-align:right;
  }

  .save-card{
    align-items:flex-start;
    flex-direction:column;
  }

/* ============================================================
   HELPERS
============================================================ */

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function toast(message){
  const old=document.querySelector(".toast");
  if(old) old.remove();

  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),3000);
}

function selectedArray(array,value){
  return array.includes(value) ? "selected" : "";
}

function toggleArrayValue(array,value){
  const i=array.indexOf(value);
  if(i>=0) array.splice(i,1);
  else array.push(value);
}

function wordCount(text){
  return String(text||"").trim()
    ? String(text).trim().split(/\s+/).length
    : 0;
}

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}


/* ============================================================
   AUTH
============================================================ */

async function checkSession(){
  const {data} = await supabaseClient.auth.getSession();
  currentUser=data.session?.user || null;
  renderHome();
}

async function loginOrSignup(){
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;

  if(!email || !password){
    toast("Enter your email and password.");
    return;
  }

  let result;

  if(authMode==="login"){
    result=await supabaseClient.auth.signInWithPassword({
      email,password
    });
  }else{
    result=await supabaseClient.auth.signUp({
      email,password
    });
  }

  if(result.error){
    toast(result.error.message);
    return;
  }

  if(authMode==="signup"){
    toast("Account created. Check your email if confirmation is required.");
  }

  currentUser=result.data.user;
  renderHome();
}

async function logout(){
  await supabaseClient.auth.signOut();
  currentUser=null;
  game=null;
  renderHome();
}


/* ============================================================
   HOME
============================================================ */

function renderHome(){
  const app=document.getElementById("app");

  if(!currentUser){
    app.innerHTML=`
      <div class="screen home">
        <div class="card auth">
          <div class="logo" style="font-size:2.5rem">Twilight</div>
          <p class="subtitle">The Story</p>

          <div class="auth-tabs">
            <button class="secondary" onclick="setAuthMode('login')">Log In</button>
            <button class="secondary" onclick="setAuthMode('signup')">Create Account</button>
          </div>

          <div class="field">
            <label>Email</label>
            <input id="authEmail" type="email" autocomplete="email">
          </div>

          <div class="field">
            <label>Password</label>
            <input id="authPassword" type="password" autocomplete="current-password">
          </div>

          <button class="primary" style="width:100%" onclick="loginOrSignup()">
            ${authMode==="login"?"Enter the Story":"Create Account"}
          </button>
        </div>
      </div>
    `;
    return;
  }

  app.innerHTML=`
    <div class="screen home">
      <div class="card home-card">
        <div class="logo">Twilight</div>
        <div class="subtitle">An interactive book-canon roleplaying story</div>

        <div class="home-actions">
          <button class="primary" onclick="startNewGame()">New Game</button>
          <button class="secondary" onclick="showSaves()">Load Game</button>
        </div>

        <div style="margin-top:20px">
          <button class="ghost" onclick="logout()">Log Out</button>
        </div>
      </div>
    </div>
  `;
}

function setAuthMode(mode){
  authMode=mode;
  renderHome();
}

============================================================ */

  game=newGameObject();
  creatorStep=0;

}

function renderCreator(){
  const app=document.getElementById("app");
  const current=CREATOR_STEPS[creatorStep];

  app.innerHTML=`
    <div class="screen">
      <div class="topbar">
        <div>
          <div class="topbar-title">Create Your Character</div>
          <div class="muted">Twilight Book Universe</div>
        </div>
        <button class="ghost" onclick="renderHome()">Exit</button>
      </div>

      <div class="oc-layout">
        <aside class="card oc-nav">
          ${CREATOR_STEPS.map((step,i)=>`
            <button
              class="${i===creatorStep?"active":""}"
              onclick="creatorGo(${i})">
              ${i+1}. ${formatStep(step)}
            </button>
          `).join("")}
        </aside>

        <main class="card oc-content">
          ${creatorSection(current)}

          <div class="creator-footer">
            <button class="secondary"
              ${creatorStep===0?"disabled":""}
              onclick="creatorGo(${creatorStep-1})">
              Back
            </button>

            ${
              creatorStep<CREATOR_STEPS.length-1
              ? `<button class="primary" onclick="creatorGo(${creatorStep+1})">Next</button>`
              : `<button class="primary" onclick="finishCharacter()">Enter Twilight</button>`
            }
          </div>
        </main>
      </div>
    </div>
  `;
}

function formatStep(s){
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function creatorGo(i){
  if(i<0 || i>=CREATOR_STEPS.length)return;
  collectCreatorInputs();
  creatorStep=i;
  renderCreator();
}

function field(id,label,value,placeholder=""){
  return `
    <div class="field">
      <label>${label}</label>
      <input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}">
    </div>
  `;
}

function area(id,label,value,placeholder=""){
  return `
    <div class="field">
      <label>${label}</label>
      <textarea id="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>
    </div>
  `;
}

/* ============================================================
   CREATOR INPUT COLLECTION
============================================================ */

function val(id){
  const el=document.getElementById(id);
  return el ? el.value : null;
}

function collectCreatorInputs(){

  if(!game)return;

  game.oc.name=val("ocName") ?? game.oc.name;
  game.oc.age=val("ocAge") ?? game.oc.age;
  game.oc.pronouns=val("ocPronouns") ?? game.oc.pronouns;
  game.oc.birthday=val("ocBirthday") ?? game.oc.birthday;

  game.oc.familyType=val("familyCustom") ?? game.oc.familyType;
  game.oc.familyReputation=val("familyRep") ?? game.oc.familyReputation;

  game.oc.appearance=val("appearanceText") ?? game.oc.appearance;
  game.oc.personality=val("personalityText") ?? game.oc.personality;

  game.oc.gift.name=val("giftName") ?? game.oc.gift.name;
  game.oc.gift.description=val("giftDescription") ?? game.oc.gift.description;
  game.oc.gift.range=val("giftRange") ?? game.oc.gift.range;
  game.oc.gift.cannot=val("giftCannot") ?? game.oc.gift.cannot;
  game.oc.gift.limitations=val("giftLimitations") ?? game.oc.gift.limitations;

  game.oc.background=val("backgroundText") ?? game.oc.background;
  game.customSituation=val("situationText") ?? game.customSituation;

  game.oc.relationships=val("relationshipsText") ?? game.oc.relationships;

  game.oc.preferences.skills=val("extraAbilities") ?? game.oc.preferences.skills;
  game.oc.preferences.likes=val("likes") ?? game.oc.preferences.likes;
  game.oc.preferences.dislikes=val("dislikes") ?? game.oc.preferences.dislikes;
  game.oc.preferences.fears=val("fears") ?? game.oc.preferences.fears;
  game.oc.preferences.goals=val("goals") ?? game.oc.preferences.goals;

  game.oc.pet.animal=val("petAnimal") ?? game.oc.pet.animal;
  game.oc.pet.name=val("petName") ?? game.oc.pet.name;
  game.oc.pet.breed=val("petBreed") ?? game.oc.pet.breed;
  game.oc.pet.appearance=val("petAppearance") ?? game.oc.pet.appearance;
  game.oc.pet.personality=val("petPersonality") ?? game.oc.pet.personality;
  game.oc.pet.bond=val("petBond") ?? game.oc.pet.bond;
  game.oc.pet.habits=val("petHabits") ?? game.oc.pet.habits;
  game.oc.pet.likes=val("petLikes") ?? game.oc.pet.likes;
  game.oc.pet.dislikes=val("petDislikes") ?? game.oc.pet.dislikes;
}

function chooseSpecies(species){
  collectCreatorInputs();
  game.oc.species=species;

  // Species-specific reset prevents incompatible abilities.
  game.oc.abilities=[];
  game.oc.gift={
    name:"",
    description:"",
    range:"",
    limitations:"",
    cannot:""
  };

  renderCreator();
}

function chooseFamily(family){
  collectCreatorInputs();
  game.oc.family=family;

  if(families[family]){
    game.oc.familyReputation=families[family].reputation;
  }

  renderCreator();
}

function toggleTrait(value){
  collectCreatorInputs();
  toggleArrayValue(game.oc.personalityTraits,value);
  renderCreator();
}

function toggleAbility(value){
  collectCreatorInputs();
  toggleArrayValue(game.oc.abilities,value);
  renderCreator();
}

function appendToField(id,text){
  const el=document.getElementById(id);
  if(!el)return;

  const current=el.value.trim();
  el.value=current ? current+", "+text : text;
  collectCreatorInputs();
}

function useGiftSuggestion(name,description){
  collectCreatorInputs();
  game.oc.gift.name=name;
  game.oc.gift.description=description;
  renderCreator();
}


/* ============================================================
   FINISH CHARACTER
============================================================ */

async function finishCharacter(){
  collectCreatorInputs();

  if(!game.oc.name.trim()){
    toast("Give your character a name.");
    creatorStep=0;
    renderCreator();
    return;
  }

  if(!game.oc.species){
    toast("Choose a species.");
    creatorStep=1;
    renderCreator();
    return;
  }

  game.name=game.oc.name;
  game.created_at=new Date().toISOString();
  game.updated_at=new Date().toISOString();

  game.conversation=[
    {
      role:"narrator",
      content:
`The story begins.

${game.oc.name} has entered the world of Twilight.

The narrator will now follow the book timeline, preserve canon character knowledge, and allow the world to continue naturally around the player.`
    }
  ];

  await saveGame(true);
  renderRP();
}


/* ============================================================
   SUPABASE SAVES
============================================================ */

async function saveGame(silent=false){

  if(!currentUser || !game)return false;

  collectCreatorInputs();

  game.user_id=currentUser.id;
  game.updated_at=new Date().toISOString();

  const payload={
    ...game,
    user_id:currentUser.id
  };

  const {error}=await supabaseClient
    .from("saved_games")
    .upsert(payload,{onConflict:"id"});

  if(error){
    console.error(error);
    if(!silent) toast("Save failed: "+error.message);
    return false;
  }

  if(!silent)toast("Game saved.");
  return true;
}

async function showSaves(){

  if(!currentUser){
    renderHome();
    return;
  }

  const app=document.getElementById("app");

  app.innerHTML=`
    <div class="screen">
      <div class="topbar">
        <div>
          <div class="topbar-title">Load Game</div>
          <div class="muted">Your saved Twilight stories</div>
        </div>
        <button class="ghost" onclick="renderHome()">Back</button>
      </div>

      <div class="center">
        <div class="card" style="padding:22px">
          <div id="saveList" class="save-list">
            <div class="loading">
              <span class="dot"></span>
              Loading saves...
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  const {data,error}=await supabaseClient
    .from("saved_games")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("updated_at",{ascending:false});

  const list=document.getElementById("saveList");

  if(error){
    list.innerHTML=`<p class="muted">${esc(error.message)}</p>`;
    return;
  }

  if(!data.length){
    list.innerHTML=`<p class="muted">No saved games yet.</p>`;
    return;
  }

  list.innerHTML=data.map(save=>`
    <div class="save-card">
      <div>
        <h3>${esc(save.name || save.oc?.name || "Untitled")}</h3>
        <div class="muted">
          ${esc(save.book || "Twilight")} ·
          ${esc(save.location || "")}
        </div>
        <small class="muted">
          ${new Date(save.updated_at).toLocaleString()}
        </small>
      </div>

      <div class="save-actions">
        <button class="primary"
          onclick='loadGame(${JSON.stringify(save).replace(/'/g,"&#39;")})'>
          Load
        </button>

        <button class="danger"
          onclick="deleteGame('${esc(save.id)}')">
          Delete
        </button>
      </div>
    </div>
  `).join("");
}

function loadGame(saved){
  game=saved;
  game.oc=game.oc || clone(defaultOC);
  game.conversation=game.conversation || [];
  game.versions=game.versions || [];
  game.memory=game.memory || "";
  game.relationships=game.relationships || "";
  game.inventory=game.inventory || "";
  game.world_state=game.world_state || "";
  game.oc.pet=game.oc.pet || clone(defaultOC.pet);
  game.oc.gift=game.oc.gift || clone(defaultOC.gift);
  game.oc.preferences=game.oc.preferences || clone(defaultOC.preferences);
  renderRP();
}

async function deleteGame(id){
  if(!confirm("Delete this saved game?"))return;

  const {error}=await supabaseClient
    .from("saved_games")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){
    toast(error.message);
    return;
  }

  showSaves();
}

22. NPCs can change their opinions based on events.

23. Actions have consequences.

24. Do not constantly make the OC the center of every canon character's attention.

25. Let scenes breathe.

26. Use sensory detail: sound, smell, weather, temperature, movement, expression, body language and atmosphere.

27. Maintain the tone of the Twilight novels without copying passages from the books.

28. Never reproduce copyrighted passages from the novels.

29. Write original prose.

30. If the player gives a short reply, continue the scene naturally instead of ending abruptly.

31. If the player explicitly asks to continue the scene, continue it without forcing a player decision.

32. Keep the narration immersive and cinematic.

33. Never summarize an entire scene when it should be played out.

34. Allow quiet moments, awkwardness, conflict, humor and natural dialogue.

35. Do not make every interaction dramatic.

CURRENT MEMORY:
${game.memory}

CURRENT STORY STATE:
${game.world_state}

Respond with the next part of the roleplay only.
`.trim();
}


/* ============================================================
   AI CALL
============================================================ */

async function callAI(userText){

  const recentConversation=game.conversation.slice(-40);

  const messages=[
    {
      role:"system",
      content:buildSystemPrompt()
    },
    ...recentConversation.map(m=>({
      role:m.role==="narrator"?"assistant":"user",
      content:m.content
    })),
    {
      role:"user",
      content:userText
    }
  ];

  const response=await fetch(AI_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      messages
    })
  });

  const raw=await response.text();

  let data;

  try{
    data=JSON.parse(raw);
  }catch{
    throw new Error(raw || "Invalid AI response.");
  }

  if(!response.ok){
    throw new Error(data.error || "AI request failed.");
  }

  if(data.success===false){
    throw new Error(data.error || "Workers AI failed.");
  }

  const result=data.result;

  if(typeof result==="string")return result;

  if(result?.response)return result.response;

  if(result?.choices?.[0]?.message?.content){
    return result.choices[0].message.content;
  }

  if(result?.result)return result.result;

  throw new Error("The AI returned no usable response.");
}

/* ============================================================
   PLAYER ACTIONS
============================================================ */

async function sendReply(){

  if(generating)return;

  const input=document.getElementById("playerInput");
  const text=input?.value.trim();

  if(!text)return;

  // Parentheses mean OOC correction/retry.
  if(text.startsWith("(") && text.endsWith(")")){
    await retryWithCorrection(text.slice(1,-1).trim());
    return;
  }

  await executePlayerAction(text);
}

async function executePlayerAction(text){

  generating=true;
  renderRP();

  try{

    game.conversation.push({
      role:"player",
      content:text
    });

    const reply=await callAI(text);

    game.conversation.push({
      role:"narrator",
      content:reply
    });

    updateAutomaticMemory();

    await saveGame(true);

  }catch(error){

    console.error(error);

    game.conversation.push({
      role:"narrator",
      content:
`[AI ERROR]

${error.message}

Your previous action has been preserved. You can try again.`
    });

  }finally{

    generating=false;
    renderRP();
  }
}

async function continueScene(){

  if(generating)return;

  generating=true;
  renderRP();

  try{

    const instruction=
`Continue the current scene naturally.

Do not control the player's OC.

Let canon characters and the environment act independently.

If the scene has unresolved tension, develop it naturally.

Do not ask the player what happens next unless the scene genuinely requires their decision.`;

    const reply=await callAI(instruction);

    game.conversation.push({
      role:"narrator",
      content:reply
    });

    updateAutomaticMemory();
    await saveGame(true);

  }catch(error){

    toast(error.message);

  }finally{

    generating=false;
    renderRP();
  }
}


/* ============================================================
   POLISH REPLY
============================================================ */

async function polishReply(){

  if(generating)return;

  const input=document.getElementById("playerInput");
  const text=input?.value.trim();

  if(!text){
    toast("Write a reply first.");
    return;
  }

  generating=true;
  renderRP();

  try{

    const prompt=`
POLISH THE PLAYER'S ROLEPLAY REPLY.

Original reply:
${text}

Rewrite it with stronger prose, natural dialogue, sensory detail,
body language and emotional nuance.

CRITICAL RULES:

- Do NOT change what the player's character actually did.
- Do NOT add major actions.
- Do NOT make decisions for the player's character.
- Do NOT change the intended meaning.
- Do NOT add supernatural abilities.
- Do NOT change dialogue meaning.
- Preserve first-person or third-person perspective if used.
- Return ONLY the polished reply.
`;

    const polished=await callAI(prompt);

    currentPolished=polished;

    showPolishModal(text,polished);

  }catch(error){

    toast(error.message);

  }finally{

    generating=false;
    renderRP();
  }
}

function showPolishModal(original,polished){

  const backdrop=document.createElement("div");
  backdrop.className="modal-backdrop";

  backdrop.innerHTML=`
    <div class="card modal">
      <h2>Polish Reply</h2>

      <div class="field">
        <label>Your original</label>
        <textarea readonly>${esc(original)}</textarea>
      </div>

      <div class="field">
        <label>Polished version</label>
        <textarea id="polishedText">${esc(polished)}</textarea>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        <button class="ghost" onclick="this.closest('.modal-backdrop').remove()">
          Cancel
        </button>

        <button class="secondary"
          onclick="replaceWithPolished()">
          Use This
        </button>

        <button class="primary"
          onclick="replaceAndSendPolished()">
          Use & Send
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(backdrop);
}

function replaceWithPolished(){

  const text=document.getElementById("polishedText")?.value || "";

  const input=document.getElementById("playerInput");

  if(input){
    input.value=text;
    updateWordCount();
  }

  document.querySelector(".modal-backdrop")?.remove();
}

async function replaceAndSendPolished(){

  const text=document.getElementById("polishedText")?.value.trim();

  document.querySelector(".modal-backdrop")?.remove();

  if(text){
    await executePlayerAction(text);
  }
}

async function rewriteReply(){

  const input=document.getElementById("playerInput");
  const text=input?.value.trim();

  if(!text){
    toast("Write a reply first.");
    return;
  }

  generating=true;
  renderRP();

  try{

    const prompt=`
Rewrite the following player roleplay reply in a different way while
preserving the exact intended action, meaning and character decision.

Do not control the player's character beyond what the original reply already says.

Original:
${text}

Return only the rewritten reply.
`;

    const rewritten=await callAI(prompt);

    showPolishModal(text,rewritten);

  }catch(error){

    toast(error.message);

  }finally{

    generating=false;
    renderRP();
  }
}


/* ============================================================
   OOC RETRY
============================================================ */

async function retryWithCorrection(correction){

  if(generating)return;

  if(game.conversation.length===0)return;

  const lastNarratorIndex=
    [...game.conversation]
      .map((x,i)=>({x,i}))
      .reverse()
      .find(o=>o.x.role==="narrator")?.i;

  if(lastNarratorIndex===undefined){
    toast("There is no narrator response to retry.");
    return;
  }

  // Remove the previous narrator response.
  game.conversation.splice(lastNarratorIndex,1);

  generating=true;
  renderRP();

  try{

    const prompt=`
The player has issued an out-of-character correction.

Correction:
${correction}

DELETE the previous narrator response conceptually and regenerate that
response from the same point in the scene.

Follow the correction.

Do not treat the correction as something the characters said.

Do not control the player's OC.

Return ONLY the corrected continuation.
`;

    const reply=await callAI(prompt);

    game.conversation.push({
      role:"narrator",
      content:reply
    });

    updateAutomaticMemory();
    await saveGame(true);

  }catch(error){

    toast(error.message);

  }finally{

    generating=false;
    renderRP();
  }
}


/* ============================================================
   MEMORY
============================================================ */

function updateAutomaticMemory(){

  const recent=game.conversation
    .slice(-12)
    .map(x=>`${x.role}: ${x.content}`)
    .join("\n");

  game.memory=
`Persistent character:
${game.oc.name}, ${game.oc.species}, family: ${game.oc.family}.

Recent story continuity:
${recent}

Important rule:
All previous events remain part of the story unless explicitly retconned
through an OOC correction.`;
}


/* ============================================================
   UI UTILITIES
============================================================ */

function updateWordCount(){

  const input=document.getElementById("playerInput");
  const counter=document.getElementById("wordCount");

  if(!input || !counter)return;

  const count=wordCount(input.value);

  counter.textContent=
    `${count} word${count===1?"":"s"}`;
}

function handleComposerKey(event){

  if(event.key==="Enter" && (event.ctrlKey || event.metaKey)){
    event.preventDefault();
    sendReply();
  }
}

function scrollConversationToBottom(){

  setTimeout(()=>{
    const el=document.getElementById("conversation");

    if(el){
      el.scrollTop=el.scrollHeight;
      window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
      });
    }
  },50);
}

function toggleSidebar(){

  const sidebar=document.getElementById("rpSidebar");

  if(!sidebar)return;

  sidebar.classList.toggle("open");
}

    try{

    }catch(e){

    }
  }

},30000);
