<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Twilight Books RP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0d0b0c;
  --panel:#151113;
  --panel2:#1b1618;
  --panel3:#211b1d;
  --border:#3a3033;
  --text:#f1e9eb;
  --muted:#a99da1;
  --accent:#b89aa7;
  --accent2:#765d68;
  --danger:#9d606b;
  --success:#76947d;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,rgba(116,91,103,.2),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}

body{
  min-height:100dvh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

input,
textarea,
select{
  width:100%;
  background:#100d0f;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 12px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--accent);
}

textarea{
  resize:vertical;
}

button{
  border:1px solid var(--border);
  background:#211a1d;
  color:var(--text);
  border-radius:8px;
  padding:10px 14px;
  transition:.15s ease;
}

button:hover{
  background:#30262a;
  border-color:#66535c;
}

button.primary{
  background:linear-gradient(135deg,#826875,#b29aa5);
  color:#100d0f;
  border-color:#bda8b0;
  font-weight:bold;
}

button.primary:hover{
  filter:brightness(1.08);
}

button.danger{
  border-color:#70444c;
  color:#e4aeb7;
}

button.success{
  border-color:#4d6755;
  color:#b5d0bb;
}

.hidden{
  display:none !important;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:.82rem;
}

.app{
  min-height:100dvh;
}

.screen{
  min-height:100dvh;
}

/* ==============================
   HOME
============================== */

.home{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.home-card{
  width:min(850px,100%);
  padding:50px;
  background:rgba(21,17,19,.96);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  text-align:center;
}

.logo{
  font-size:clamp(2.5rem,7vw,5rem);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-style:italic;
  margin-bottom:40px;
}

.home-actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.home-actions button{
  min-height:58px;
}

/* ==============================
   AUTH
============================== */

.auth-box{
  width:min(460px,100%);
  margin:auto;
  padding:30px;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.auth-box h2{
  margin-top:0;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  color:#d9ced2;
  font-size:.9rem;
}

.auth-actions{
  display:grid;
  gap:8px;
}

/* ==============================
   CREATOR
============================== */

.creator{
  min-height:100dvh;
  padding:20px;
}

.creator-inner{
  width:min(1100px,100%);
  margin:auto;
}

.creator-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.creator-header h1{
  margin:0;
}

.creator-grid{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:20px;
}

.creator-nav{
  background:var(--panel);
  border:1px solid var(--border);
  padding:10px;
  height:max-content;
  position:sticky;
  top:20px;
}

.creator-nav button{
  display:block;
  width:100%;
  text-align:left;
  margin-bottom:5px;
}

.creator-nav button.active{
  background:#30252a;
  border-color:#705d66;
}

.creator-content{
  background:var(--panel);
  border:1px solid var(--border);
  padding:25px;
}

.section-title{
  margin-top:0;
  font-size:1.55rem;
}

.section-description{
  color:var(--muted);
  line-height:1.6;
}

.card-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.option-card{
  padding:15px;
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:10px;
  cursor:pointer;
}

.option-card:hover{
  border-color:#68565f;
}

.option-card.selected{
  border-color:var(--accent);
  background:#292126;
}

.option-card strong{
  display:block;
  margin-bottom:5px;
}

.option-card span{
  color:var(--muted);
  font-size:.88rem;
  line-height:1.4;
}

.suggestion-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px;
  margin-bottom:15px;
}

.suggestion{
  font-size:.78rem;
  padding:7px 9px;
}

.creator-footer{
  margin-top:20px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

/* ==============================
   LOAD
============================== */

.load-screen{
  min-height:100dvh;
  padding:25px;
}

.load-inner{
  width:min(1000px,100%);
  margin:auto;
}

.save-card{
  background:var(--panel);
  border:1px solid var(--border);
  padding:18px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  border-radius:10px;
}

.save-info strong{
  display:block;
  margin-bottom:5px;
}

.save-info span{
  color:var(--muted);
  font-size:.82rem;
}

.save-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* ==============================
   RP LAYOUT
============================== */

.rp-layout{
  width:100%;
  height:100dvh;
  min-height:100dvh;
  display:grid;
  grid-template-columns:290px minmax(0,1fr);
  overflow:hidden;
}

.rp-sidebar{
  height:100dvh;
  background:#151214;
  border-right:1px solid var(--border);
  padding:20px;
  overflow-y:auto;
  z-index:50;
}

.rp-sidebar h3{
  margin-top:0;
}

.sidebar-section{
  border-top:1px solid var(--border);
  padding-top:15px;
  margin-top:15px;
}

.sidebar-stat{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:5px 0;
  font-size:.86rem;
}

.sidebar-stat span:last-child{
  color:var(--muted);
  text-align:right;
}

.rp-main{
  min-width:0;
  min-height:0;
  height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
}

.rp-header{
  min-height:64px;
  padding:12px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(18,15,17,.97);
  backdrop-filter:blur(12px);
  z-index:20;
}

.rp-title{
  min-width:0;
}

.rp-title strong{
  display:block;
}

.rp-title span{
  color:var(--muted);
  font-size:.78rem;
}

.rp-header-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.conversation{
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding:30px 22px;
  -webkit-overflow-scrolling:touch;
}

.conversation-inner{
  width:min(950px,100%);
  margin:auto;
}

.message{
  margin-bottom:28px;
}

.message-role{
  color:var(--muted);
  font-size:.73rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:7px;
}

.message-body{
  line-height:1.8;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message.narrator .message-body{
  font-size:1.02rem;
}

.message.player .message-body{
  background:#262023;
  border-left:3px solid var(--accent);
  padding:13px 16px;
  border-radius:4px 12px 12px 4px;
}

.message.system .message-body{
  color:var(--muted);
  font-size:.85rem;
  font-style:italic;
}

.composer{
  width:100%;
  background:#120f11;
  border-top:1px solid var(--border);
  padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));
  z-index:30;
}

.composer-inner{
  width:min(950px,100%);
  margin:auto;
}

.composer textarea{
  display:block;
  width:100%;
  min-height:82px;
  max-height:220px;
  resize:vertical;
  background:#1b1719;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:12px;
  padding:13px;
  font-size:16px;
}

.composer-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
}

.word-count{
  color:var(--muted);
  margin-left:auto;
  font-size:.82rem;
}

.mobile-menu{
  display:none;
}

/* ==============================
   MODALS
============================== */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal{
  width:min(700px,100%);
  max-height:min(85dvh,800px);
  overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:25px;
}

.modal h2{
  margin-top:0;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* ==============================
   TOAST
============================== */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  max-width:360px;
  padding:12px 15px;
  background:#211b1d;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  z-index:2000;
}

.toast.error{
  border-color:#70444c;
}

.toast.success{
  border-color:#4d6755;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:850px){

  .home{
    padding:15px;
  }

  .home-card{
    padding:30px 20px;
  }

  .home-actions{
    grid-template-columns:1fr;
  }

  .creator{
    padding:10px;
  }

  .creator-grid{
    grid-template-columns:1fr;
  }

  .creator-nav{
    position:static;
    display:flex;
    overflow-x:auto;
    gap:5px;
    padding:6px;
  }

  .creator-nav button{
    white-space:nowrap;
    width:auto;
    margin:0;
  }

  .creator-content{
    padding:18px;
  }

  .card-grid{
    grid-template-columns:1fr;
  }

  .rp-layout{
    display:block;
    width:100%;
    height:100dvh;
    min-height:100dvh;
    overflow:hidden;
  }

  .rp-main{
    width:100%;
    height:100dvh;
    min-height:100dvh;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
  }

  .rp-sidebar{
    position:fixed;
    top:0;
    bottom:0;
    left:-310px;
    width:290px;
    height:100dvh;
    transition:left .25s ease;
    box-shadow:var(--shadow);
  }

  .rp-sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
    flex-shrink:0;
  }

  .rp-header{
    min-height:58px;
    padding:10px;
  }

  .rp-header-actions{
    gap:4px;
  }

  .rp-header-actions button{
    padding:8px 9px;
  }

  .conversation{
    padding:20px 12px;
  }

  .composer{
    padding:
      8px
      8px
      calc(8px + env(safe-area-inset-bottom,0px));
  }

  .composer textarea{
    min-height:76px;
    max-height:180px;
    font-size:16px;
  }

  .composer-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  .composer-actions button{
    width:100%;
    min-height:44px;
  }

  .word-count{
    grid-column:1 / -1;
    width:100%;
    margin:0;
    text-align:right;
  }

  .save-card{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:500px){

  .rp-header{
    gap:7px;
  }

  .rp-title{
    max-width:50%;
  }

  .rp-header-actions button{
    padding:7px 8px;
    font-size:.75rem;
  }

  .conversation{
    padding-left:10px;
    padding-right:10px;
  }

  .composer textarea{
    min-height:72px;
  }

  .message-body{
    font-size:.98rem;
  }

  .creator-footer{
    flex-direction:column;
  }

  .creator-footer button{
    width:100%;
  }
}
</style>
</head>

/* ============================================================
   UTILITY
============================================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(date){

  if(!date) return "";

  return new Date(date).toLocaleString();

}


function showToast(message,type=""){

  const root=document.getElementById("toastRoot");

  root.innerHTML=
    `<div class="toast ${type}">
      ${escapeHtml(message)}
    </div>`;

  setTimeout(()=>{
    root.innerHTML="";
  },3500);

}


function setScreen(screen){

  currentScreen=screen;
  render();
}


function getSpecies(){

  return SPECIES[creatorData.species] || SPECIES.human;

}


function getFamily(){

  return FAMILIES.find(x=>x[0]===creatorData.family.id) || FAMILIES[FAMILIES.length-1];

}


function countWords(text){

  return String(text||"")
    .trim()
    .split(/\s+/)
    .filter(Boolean)
    .length;

}


/* ============================================================
   AUTH
============================================================ */

async function initializeAuth(){

  const result=await supabaseClient.auth.getSession();

  session=result.data.session;

  supabaseClient.auth.onAuthStateChange((_event,newSession)=>{

    session=newSession;

    if(!session){
      currentGame=null;
      currentSaveId=null;
      setScreen("home");
    }

  });

  render();

}


async function signUp(){

  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;

  if(!email || !password){

    showToast("Enter an email and password.","error");
    return;

  }

  const {error}=await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){

    showToast(error.message,"error");
    return;

  }

async function callAI(messages){

  console.log("Sending AI request...");
  console.log("Messages:", messages);

  let response;

  try{

    response = await fetch(AI_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        messages:messages
      })
    });

  }catch(networkError){

    console.error(
      "AI NETWORK ERROR:",
      networkError
    );

    throw new Error(
      "Could not connect to the AI server."
    );

  }

  const rawText = await response.text();

  console.log(
    "AI HTTP STATUS:",
    response.status
  );

  console.log(
    "AI RAW RESPONSE:",
    rawText
  );

  let data;

  try{

    data = JSON.parse(rawText);

  }catch(parseError){

    console.error(
      "AI JSON PARSE ERROR:",
      parseError
    );

    throw new Error(
      "The AI server returned invalid data."
    );

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      `AI server error: ${response.status}`
    );

  }

  if(!data.success){

    throw new Error(
      data.error ||
      "Workers AI returned an error."
    );

  }

  const answer =
    data.result?.choices?.[0]?.message?.content ||
    "";

  if(!answer){

    console.error(
      "Unexpected AI response:",
      data
    );

    throw new Error(
      "The AI responded, but no text was found."
    );

  }

  return answer;

}

async function startOpeningScene(){

  if(!currentGame) return;

  generating=true;
  render();

  try{

    const messages=[
      {
        role:"system",
        content:buildSystemPrompt()
      },
      {
        role:"user",
        content:
          `Begin the roleplay now. Start naturally at the beginning of the Twilight timeline. `+
          `Do not control the player's OC. Establish the setting and give the player a clear `+
          `opportunity to act.`
      }
    ];

    const answer=await callAI(messages);

    currentGame.currentScene=answer;

    currentGame.conversation.push({
      role:"assistant",
      content:answer
    });

    await saveGame(true);

  }catch(error){

    showToast(error.message,"error");

  }finally{

    generating=false;
    render();

  }

}


async function executePlayerAction(){

  }finally{

    render();

  }

}

async function retryWithCorrection(){

  if(generating || !currentGame) return;

  const textarea=document.getElementById("replyInput");

  const correction=textarea?.value.trim();

  if(!correction) return;

  if(!correction.startsWith("(")){

    showToast("Use parentheses for an OOC correction.","error");
    return;

  }

  generating=true;

  if(
    currentGame.conversation.length &&
    currentGame.conversation.at(-1).role==="assistant"
  ){

    currentGame.conversation.pop();

  }

  currentGame.conversation.push({
    role:"user",
    content:
      `[OOC CORRECTION — DO NOT INCLUDE THIS IN THE STORY]\n${correction}`
  });

  render();

  try{

    const messages=[
      {
        role:"system",
        content:buildSystemPrompt()
      },

      ...currentGame.conversation
        .filter(m=>m.role!=="system")
        .slice(-30),

      {
        role:"user",
        content:
          "Regenerate the previous narrator response according to the OOC correction. "+
          "Do not mention the correction in the story."
      }

    ];

    const answer=await callAI(messages);

    currentGame.conversation.pop();

    currentGame.conversation.push({
      role:"assistant",
      content:answer
    });

    updateMemory();

    await saveGame(true);

  }catch(error){

    showToast(error.message,"error");

  }finally{

    generating=false;
    render();

  }

}

   SAVING
============================================================ */

function getSavePayload(){

  return {

    oc:currentGame.oc,

    game:{
      id:currentGame.id,
      createdAt:currentGame.createdAt,
      book:currentGame.book,
      chapter:currentGame.chapter,
      timeline:currentGame.timeline,
      location:currentGame.location,
      currentScene:currentGame.currentScene,
      conversation:currentGame.conversation,
      memory:currentGame.memory,
      versions:currentGame.versions || [],
      lastSaved:new Date().toISOString()
    }

  };

}


async function saveGame(silent=false){

  if(!session || !currentGame) return;

  updateMemory();

  const payload=getSavePayload();

  const name=
    currentGame.oc?.name
      ? `${currentGame.oc.name} — ${currentGame.book}`
      : `Twilight RP — ${currentGame.book}`;

  let result;

  if(currentSaveId){

    result=await supabaseClient
      .from("saved_games")
      .update({
        name,
        data:payload,
        updated_at:new Date().toISOString()
      })
      .eq("id",currentSaveId)
      .eq("user_id",session.user.id);

  }else{

    result=await supabaseClient
      .from("saved_games")
      .insert({
        user_id:session.user.id,
        name,
        data:payload
      })
      .select()
      .single();

    if(!result.error){

      currentSaveId=result.data.id;

    }

  }

  if(result.error){

    console.error(result.error);

    if(!silent){

      showToast(
        "Save failed: "+result.error.message,
        "error"
      );

    }

    return;

  }

  currentGame.lastSaved=new Date().toISOString();

  if(!silent){

    showToast("Game saved.","success");

  }

}

async function createVersion(){

  if(!currentGame || !session) return;

  const snapshot=structuredClone({
    timestamp:new Date().toISOString(),
    book:currentGame.book,
    chapter:currentGame.chapter,
    location:currentGame.location,
    conversation:currentGame.conversation,
    memory:currentGame.memory
  });

  currentGame.versions=currentGame.versions || [];

  currentGame.versions.unshift(snapshot);

  currentGame.versions=
    currentGame.versions.slice(0,20);

  await saveGame(true);

  showToast("Version created.","success");

}

  if(!currentGame) return;

  const versions=currentGame.versions || [];

  const html=versions.length
    ? versions.map((v,i)=>`
        <div class="save-card">
          <div class="save-info">
            <strong>Version ${versions.length-i}</strong>
            <span>${escapeHtml(formatDate(v.timestamp))}</span>
          </div>

          <button

    : `<p class="muted">No versions have been created yet.</p>`;

  document.getElementById("modalRoot").innerHTML=`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">

        ${html}

          <button onclick="closeModal()">Close</button>
        </div>

      </div>
    </div>
  `;

}


async function restoreVersion(index){

  const version=currentGame.versions?.[index];

  if(!version) return;

  currentGame.book=version.book;
  currentGame.chapter=version.chapter;
  currentGame.location=version.location;
  currentGame.conversation=
    structuredClone(version.conversation);
  currentGame.memory=
    structuredClone(version.memory);

  closeModal();

  await saveGame();

  render();

}

============================================================ */

function renderCreator(){

  const step=creatorStep;

  let content="";

  if(step===0) content=creatorIdentity();
  if(step===1) content=creatorSpecies();
  if(step===2) content=creatorFamily();
  if(step===3) content=creatorAppearance();
  if(step===4) content=creatorPersonality();
  if(step===5) content=creatorAbilities();
  if(step===6) content=creatorBackground();
  if(step===7) content=creatorRelationships();
  if(step===8) content=creatorPet();
  if(step===9) content=creatorPreferences();
  if(step===10) content=creatorReview();

  return `
    <section class="creator">

      <div class="creator-inner">

        <div class="creator-header">

          <div>
            <h1>Create Your Character</h1>
            <div class="muted">
              ${step+1} / ${CREATOR_STEPS.length}
            </div>
          </div>

          <button onclick="setScreen('home')">
            Exit
          </button>

        </div>

        <div class="creator-grid">

          <nav class="creator-nav">

            ${CREATOR_STEPS.map((name,i)=>`
              <button
                class="${i===step?'active':''}"
                onclick="creatorStep=${i};render()"
              >
                ${i+1}. ${name}
              </button>
            `).join("")}

          </nav>

          <main class="creator-content">

            ${content}

            <div class="creator-footer">

              <button
                ${step===0?'disabled':''}
                onclick="creatorStep=Math.max(0,creatorStep-1);render()"
              >
                Back
              </button>

              ${
                step<CREATOR_STEPS.length-1
                ? `
                  <button
                    class="primary"
                    onclick="
                      if(creatorStep===CREATOR_STEPS.length-2 && !validateCreator()) return;
                      creatorStep++;
                      render();
                    "
                  >
                    Continue
                  </button>
                `
                : `
                  <button
                    class="primary"
                    onclick="createGameFromOC()"
                  >
                    Begin Twilight
                  </button>
                `
              }

            </div>

          </main>

        </div>

      </div>

    </section>
  `;

}

function render(){

  const app=document.getElementById("app");

  if(currentScreen==="home"){

    app.innerHTML=renderHome();
    return;

  }

  if(currentScreen==="auth"){

    app.innerHTML=renderAuth();
    return;

  }

  if(currentScreen==="creator"){

    app.innerHTML=renderCreator();
    return;

  }

  if(currentScreen==="rp"){

    if(!currentGame){

      currentScreen="home";
      render();
      return;

    }

    app.innerHTML=renderRP();

    updateWordCount();

    scrollConversationToBottom();

    return;

  }

  if(currentScreen==="load"){

    renderLoad();

  }

}
