<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twilight Books Roleplay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(135deg, #11151a, #252b31 45%, #0d1014);
    color: #eee;
    font-family: Georgia, "Times New Roman", serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =========================
   AUTH
========================= */

.screen {
    min-height: 100vh;
}

.auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.auth-card {
    width: min(430px, 100%);
    padding: 40px;
    background: rgba(15,18,22,.92);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;
    box-shadow: 0 25px 80px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    letter-spacing: 9px;
    font-size: clamp(34px, 9vw, 58px);
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    opacity: .65;
    letter-spacing: 3px;
    margin-bottom: 35px;
    font-size: 12px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    opacity: .75;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07);
    color: white;
    outline: none;
}

.field textarea {
    min-height: 90px;
    resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: rgba(255,255,255,.45);
}

.primary-btn,
.secondary-btn,
.danger-btn {
    width: 100%;
    padding: 13px 18px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,.18);
    margin-top: 8px;
    transition: .2s;
}

.primary-btn {
    background: #eee;
    color: #111;
}

.secondary-btn {
    background: rgba(255,255,255,.08);
    color: white;
}

.danger-btn {
    background: rgba(130,35,35,.45);
    color: white;
}

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

.message {
    min-height: 22px;
    margin: 12px 0;
    text-align: center;
    font-size: 13px;
    color: #d9b5b5;
}

/* =========================
   HOME
========================= */

.home {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.home-inner {
    width: min(700px, 100%);
    text-align: center;
}

.home-logo {
    font-size: clamp(55px, 13vw, 110px);
    letter-spacing: 15px;
    margin: 0;
}

.home-subtitle {
    letter-spacing: 6px;
    opacity: .55;
    margin-bottom: 55px;
}

.home-buttons {
    display: grid;
    gap: 12px;
    max-width: 360px;
    margin: auto;
}

/* =========================
   CREATOR
========================= */

.creator {
    padding: 30px;
}

.creator-container {
    width: min(850px, 100%);
    margin: auto;
}

.page-title {
    text-align: center;
    font-size: 35px;
    letter-spacing: 4px;
    margin-bottom: 5px;
}

.page-description {
    text-align: center;
    opacity: .6;
    margin-bottom: 35px;
}

.section {
    background: rgba(10,13,17,.78);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
}

.section h2 {
    margin-top: 0;
    font-size: 18px;
    letter-spacing: 2px;
}

.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

@media(max-width:650px) {
    .two-column {
        grid-template-columns: 1fr;
    }

    .creator,
    .auth-screen {
        padding: 15px;
    }
}

/* =========================
   LOAD
========================= */

.load {
    padding: 30px;
}

.load-container {
    width: min(850px, 100%);
    margin: auto;
}

.save-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 18px;
    margin-bottom: 12px;
    background: rgba(10,13,17,.8);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;
}

.save-info h3 {
    margin: 0 0 6px;
}

.save-info p {
    margin: 3px 0;
    opacity: .6;
    font-size: 13px;
}

.save-actions {
    display: flex;
    gap: 8px;
}

.small-btn {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08);
    color: white;
    padding: 9px 12px;
    border-radius: 7px;
}

/* =========================
   RP
========================= */

.rp {
    height: 100vh;
    display: grid;
    grid-template-columns: 270px 1fr;
    overflow: hidden;
}

.sidebar {
    background: rgba(8,10,13,.95);
    border-right: 1px solid rgba(255,255,255,.1);
    padding: 20px;
    overflow-y: auto;
}

.sidebar-title {
    letter-spacing: 3px;
    font-size: 18px;
    margin-bottom: 25px;
}

.sidebar-section {
    margin-bottom: 25px;
}

.sidebar-section h4 {
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .45;
    margin-bottom: 9px;
}

.sidebar-section p {
    margin: 4px 0;
    font-size: 13px;
    opacity: .75;
}

.sidebar button {
    width: 100%;
    margin-top: 7px;
}

.story {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.story-header {
    padding: 15px 22px;
    background: rgba(15,18,22,.92);
    border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.story-title {
    letter-spacing: 3px;
}

.story-meta {
    opacity: .55;
    font-size: 12px;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message-row {
    max-width: 850px;
    margin: 0 auto 20px;
}

.message-author {
    font-size: 11px;
    letter-spacing: 2px;
    opacity: .45;
    margin-bottom: 5px;
    text-transform: uppercase;
}

.message-content {
    line-height: 1.75;
    white-space: pre-wrap;
}

.message-row.narrator .message-content {
    font-style: italic;
}

.message-row.player .message-content {
    background: rgba(255,255,255,.07);
    padding: 14px 17px;
    border-radius: 12px;
}

.composer {
    border-top: 1px solid rgba(255,255,255,.1);
    padding: 15px;
    background: rgba(10,12,15,.96);
}

.composer-inner {
    max-width: 900px;
    margin: auto;
}

.composer textarea {
    width: 100%;
    min-height: 90px;
    resize: none;
    border-radius: 10px;
    padding: 13px;
    background: rgba(255,255,255,.06);
    color: white;
    border: 1px solid rgba(255,255,255,.12);
}

.composer-buttons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.composer-buttons button {
    flex: 1;
}

.word-count {
    text-align: right;
    font-size: 11px;
    opacity: .4;
    margin-top: 5px;
}

@media(max-width:750px) {
    .rp {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: none;
    }

    .story-header {
        padding: 12px;
    }

    .messages {
        padding: 15px;
    }
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: min(700px, 100%);
    max-height: 80vh;
    overflow-y: auto;
    background: #15191e;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 15px;
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
}

.close-btn {
    float: right;
    background: none;
    color: white;
    border: none;
    font-size: 20px;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen" class="screen auth-screen">
    <div class="auth-card">
        <div class="logo">TWILIGHT</div>
        <div class="subtitle">BOOKS ROLEPLAY</div>

        <div class="field">
            <label>Email</label>
            <input id="loginEmail" type="email" autocomplete="email">
        </div>

        <div class="field">
            <label>Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password">
        </div>

        <button class="primary-btn" onclick="login()">Log In</button>
        <button class="secondary-btn" onclick="createAccount()">Create Account</button>

        <div id="authMessage" class="message"></div>
    </div>
</section>

<!-- =========================
     HOME
========================= -->

<section id="homeScreen" class="screen home hidden">
    <div class="home-inner">
        <h1 class="home-logo">TWILIGHT</h1>
        <div class="home-subtitle">BOOKS ROLEPLAY</div>

        <div class="home-buttons">
            <button class="primary-btn" onclick="showCreator()">NEW GAME</button>
            <button class="secondary-btn" onclick="showLoad()">LOAD GAME</button>
            <button class="secondary-btn" onclick="logout()">LOG OUT</button>
        </div>
    </div>
</section>

<!-- =========================
     CHARACTER CREATOR
========================= -->

<section id="creatorScreen" class="screen creator hidden">
    <div class="creator-container">

        <h1 class="page-title">CREATE YOUR CHARACTER</h1>
        <p class="page-description">
            Your character becomes part of the Twilight world.
        </p>

        <div class="section">
            <h2>CHARACTER</h2>

            <div class="two-column">

                <div class="field">
                    <label>Name</label>
                    <input id="ocName" placeholder="Your character's name">
                </div>

                <div class="field">
                    <label>Age</label>
                    <input id="ocAge" type="number" placeholder="Age">
                </div>

            </div>

            <div class="field">
                <label>Appearance</label>
                <textarea id="ocAppearance"
                    placeholder="Describe your character's appearance..."></textarea>
            </div>

            <div class="field">
                <label>Personality</label>
                <textarea id="ocPersonality"
                    placeholder="Personality, habits, mannerisms..."></textarea>
            </div>

            <div class="field">
                <label>Background</label>
                <textarea id="ocBackground"
                    placeholder="Family, history, where they came from..."></textarea>
            </div>

            <div class="field">
                <label>Additional Details</label>
                <textarea id="ocDetails"
                    placeholder="Anything else you want the story to know..."></textarea>
            </div>
        </div>

        <div class="section">
            <h2>STORY SETUP</h2>

            <div class="field">
                <label>Book</label>
                <select id="book">
                    <option value="Twilight">Twilight</option>
                    <option value="New Moon">New Moon</option>
                    <option value="Eclipse">Eclipse</option>
                    <option value="Breaking Dawn">Breaking Dawn</option>
                </select>
            </div>

            <div class="field">
                <label>Starting Location</label>
                <select id="location">
                    <option value="Forks">Forks</option>
                    <option value="Forks High School">Forks High School</option>
                    <option value="Bella's neighborhood">Bella's neighborhood</option>
                    <option value="The Cullen house">The Cullen house</option>
                    <option value="La Push">La Push</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="field">
                <label>Starting Point</label>
                <select id="timeline">
                    <option value="Before Bella arrives in Forks">
                        Before Bella arrives in Forks
                    </option>
                    <option value="Early Twilight">
                        Early Twilight
                    </option>
                    <option value="During Twilight">
                        During Twilight
                    </option>
                    <option value="Custom">
                        Custom
                    </option>
                </select>
            </div>

            <div class="field">
                <label>Custom Situation</label>
                <textarea id="customSituation"
                    placeholder="Optional. Describe exactly where/how you want your story to begin."></textarea>
            </div>
        </div>

        <button class="primary-btn" onclick="createGame()">
            BEGIN STORY
        </button>

        <button class="secondary-btn" onclick="showHome()">
            BACK
        </button>

        <div id="creatorMessage" class="message"></div>

    </div>
</section>

<!-- =========================
     LOAD GAME
========================= -->

<section id="loadScreen" class="screen load hidden">
    <div class="load-container">

        <h1 class="page-title">LOAD GAME</h1>
        <p class="page-description">
            Continue exactly where you left off.
        </p>

        <div id="saveList"></div>

        <button class="secondary-btn" onclick="showHome()">
            BACK
        </button>

    </div>
</section>

<!-- =========================
     ROLEPLAY
========================= -->

<section id="rpScreen" class="screen rp hidden">

    <aside class="sidebar">

        <div class="sidebar-title">TWILIGHT</div>

        <div class="sidebar-section">
            <h4>CHARACTER</h4>
            <p id="sideCharacter"></p>
            <p id="sideAge"></p>
        </div>

        <div class="sidebar-section">
            <h4>LOCATION</h4>
            <p id="sideLocation"></p>
        </div>

        <div class="sidebar-section">
            <h4>TIMELINE</h4>
            <p id="sideTimeline"></p>
        </div>

        <div class="sidebar-section">
            <h4>MEMORY</h4>
            <button class="small-btn" onclick="showMemory()">
                VIEW MEMORY
            </button>
        </div>

        <div class="sidebar-section">
            <button class="small-btn" onclick="saveGame(true)">
                SAVE
            </button>

            <button class="small-btn" onclick="continueScene()">
                CONTINUE SCENE
            </button>

            <button class="small-btn" onclick="retryNarration()">
                RETRY
            </button>

            <button class="small-btn" onclick="exitGame()">
                EXIT
            </button>
        </div>

    </aside>

    <main class="story">

        <header class="story-header">
            <div>
                <div class="story-title" id="storyTitle">
                    TWILIGHT
                </div>
                <div class="story-meta" id="storyMeta"></div>
            </div>

            <div class="story-meta">
                <span id="saveStatus">Saved</span>
            </div>
        </header>

        <div id="messages" class="messages"></div>

        <div class="composer">

            <div class="composer-inner">

                <textarea
                    id="playerInput"
                    placeholder="What do you do or say?"
                    oninput="updateWordCount()"
                ></textarea>

                <div class="word-count">
                    <span id="wordCount">0</span> words
                </div>

                <div class="composer-buttons">
                    <button class="primary-btn" onclick="sendResponse()">
                        SEND
                    </button>

                    <button class="secondary-btn" onclick="continueScene()">
                        LET SCENE CONTINUE
                    </button>
                </div>

            </div>

        </div>

    </main>

</section>

<!-- =========================
     MEMORY MODAL
========================= -->

<div id="memoryModal" class="modal-overlay hidden">

    <div class="modal">

        <button class="close-btn" onclick="closeMemory()">×</button>

        <h2>MEMORY</h2>

        <div id="memoryContent"></div>

    </div>

</div>

<script>

/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://aedijtklkqxzpgtixrte.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gREm1GLqj2ITLH4njYge1A_YLXaK70h";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   GAME STATE
============================================================ */

let game = null;
let currentUser = null;


/* ============================================================
   SCREEN CONTROL
============================================================ */

function hideAllScreens() {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.add("hidden");
    });

}

function showScreen(id) {

    hideAllScreens();

    document
        .getElementById(id)
        .classList.remove("hidden");

}

function showHome() {

    showScreen("homeScreen");

}

function showCreator() {

    showScreen("creatorScreen");

}

async function showLoad() {

    showScreen("loadScreen");

    await loadSaveList();

}


/* ============================================================
   AUTH
============================================================ */

async function createAccount() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!email || !password) {

        showAuthMessage(
            "Enter an email and password."
        );

        return;
    }

    if (password.length < 6) {

        showAuthMessage(
            "Password must be at least 6 characters."
        );

        return;
    }

    showAuthMessage("Creating account...");

    const { data, error } =
        await supabaseClient.auth.signUp({
            email,
            password
        });

    if (error) {

        showAuthMessage(error.message);

        return;
    }

    if (data.session) {

        currentUser = data.user;

        showHome();

    } else {

        showAuthMessage(
            "Account created. Check your email if confirmation is required, then log in."
        );

    }

}


async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!email || !password) {

        showAuthMessage(
            "Enter your email and password."
        );

        return;
    }

    showAuthMessage("Logging in...");

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        showAuthMessage(error.message);

        return;
    }

    currentUser = data.user;

    showHome();

}


async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    game = null;

    showScreen("loginScreen");

}


function showAuthMessage(message) {

    document.getElementById(
        "authMessage"
    ).textContent = message;

}


/* ============================================================
   INITIAL SESSION
============================================================ */

async function initializeApp() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

        currentUser = session.user;

        showHome();

    } else {

        showScreen("loginScreen");

    }

}


initializeApp();


/* ============================================================
   CREATE GAME
============================================================ */

async function createGame() {

    if (!currentUser) {

        showCreatorMessage(
            "You must be logged in."
        );

        return;
    }

    const name =
        document.getElementById("ocName").value.trim();

    const age =
        document.getElementById("ocAge").value.trim();

    if (!name) {

        showCreatorMessage(
            "Please enter your character's name."
        );

        return;
    }

    const userId = currentUser.id;

    game = {

        id: crypto.randomUUID(),

        user_id: userId,

        name: name,

        book:
            document.getElementById("book").value,

        location:
            document.getElementById("location").value,

        timeline:
            document.getElementById("timeline").value,

        oc: {

            name,

            age,

            appearance:
                document.getElementById("ocAppearance").value,

            personality:
                document.getElementById("ocPersonality").value,

            background:
                document.getElementById("ocBackground").value,

            details:
                document.getElementById("ocDetails").value

        },

        memory: [],

        relationships: {},

        inventory: [],

        world_state: {},

        conversation: [],

        versions: [],

        customSituation:
            document.getElementById("customSituation").value,

        created_at:
            new Date().toISOString(),

        updated_at:
            new Date().toISOString()

    };

    addNarratorMessage(
        createOpeningNarration()
    );

    const success =
        await saveGame(false);

    if (!success) {

        return;
    }

    renderGame();

    showScreen("rpScreen");

}


/* ============================================================
   OPENING
============================================================ */

function createOpeningNarration() {

    const custom =
        game.customSituation.trim();

    if (custom) {

        return custom;

    }

    return `
The rain has settled over Forks again, turning the streets dark and reflective beneath the gray Washington sky.

Everything feels ordinary at first.

Cars move through the wet roads. Students talk in the halls. Teachers carry on with their routines.

But beneath the familiar rhythm of the town, something is beginning to change.

You are here now.

The story has not been written around you.

Your choices will become part of it.
`.trim();

}


/* ============================================================
   PLAYER RESPONSE
============================================================ */

async function sendResponse() {

    const input =
        document.getElementById("playerInput");

    const text =
        input.value.trim();

    if (!text) return;

    if (!game) return;

    input.value = "";

    updateWordCount();

    if (
        text.startsWith("(") &&
        text.endsWith(")")
    ) {

        handleOOC(text);

        return;
    }

    addPlayerMessage(text);

    await processPlayerAction(text);

    await saveGame(false);

    renderGame();

}


function handleOOC(text) {

    const instruction =
        text.slice(1, -1).trim().toLowerCase();

    if (
        instruction.includes("retry") ||
        instruction.includes("redo") ||
        instruction.includes("fix") ||
        instruction.includes("change")
    ) {

        removeLastNarratorMessage();

        addNarratorMessage(
            "The previous narration has been removed. The scene will be retried."
        );

    } else {

        addNarratorMessage(
            "OOC instruction received: " + instruction
        );

    }

    saveGame(false);

    renderGame();

}


/* ============================================================
   CURRENT STORY ENGINE
============================================================ */

/*
   This is intentionally structured so the actual AI engine
   can be connected here later.

   The save system, character system, conversation history,
   memory and timeline are already separate from this function.
*/

async function processPlayerAction(text) {

    const lower =
        text.toLowerCase();

    let response = "";

    if (
        lower.includes("school")
    ) {

        response =
            "The school continues around you, filled with the ordinary sounds of students moving between classes.";

    } else if (
        lower.includes("cullen")
    ) {

        response =
            "The name seems to carry a strange weight in the room. The Cullens are known around town, though most people know very little about them.";

    } else if (
        lower.includes("bella")
    ) {

        response =
            "Bella Swan has become a noticeable presence in Forks. Her arrival has already begun changing the rhythm of the small town.";

    } else {

        response =
            "The moment unfolds naturally around your choice. The world does not stop simply because you are deciding what to do next.";

    }

    addNarratorMessage(response);

}


/* ============================================================
   CONTINUE SCENE
============================================================ */

async function continueScene() {

    if (!game) return;

    addNarratorMessage(
        "The scene continues around you. The sounds, people and atmosphere of the moment carry forward while the world waits to see what you do next."
    );

    await saveGame(false);

    renderGame();

}


/* ============================================================
   RETRY
============================================================ */

async function retryNarration() {

    if (!game) return;

    removeLastNarratorMessage();

    addNarratorMessage(
        "The scene rewinds to the previous moment, allowing the narration to unfold again."
    );

    await saveGame(false);

    renderGame();

}


/* ============================================================
   MESSAGES
============================================================ */

function addNarratorMessage(text) {

    game.conversation.push({

        role: "narrator",

        content: text,

        timestamp:
            new Date().toISOString()

    });

}


function addPlayerMessage(text) {

    game.conversation.push({

        role: "player",

        content: text,

        timestamp:
            new Date().toISOString()

    });

}


function removeLastNarratorMessage() {

    for (
        let i = game.conversation.length - 1;
        i >= 0;
        i--
    ) {

        if (
            game.conversation[i].role === "narrator"
        ) {

            game.conversation.splice(i, 1);

            break;
        }

    }

}


/* ============================================================
   RENDER
============================================================ */

function renderGame() {

    if (!game) return;

    document.getElementById(
        "storyTitle"
    ).textContent =
        game.book.toUpperCase();

    document.getElementById(
        "storyMeta"
    ).textContent =
        `${game.location} • ${game.timeline}`;

    document.getElementById(
        "sideCharacter"
    ).textContent =
        game.oc.name;

    document.getElementById(
        "sideAge"
    ).textContent =
        game.oc.age
            ? `Age ${game.oc.age}`
            : "";

    document.getElementById(
        "sideLocation"
    ).textContent =
        game.location;

    document.getElementById(
        "sideTimeline"
    ).textContent =
        game.timeline;

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    game.conversation.forEach(message => {

        const row =
            document.createElement("div");

        row.className =
            "message-row " +
            message.role;

        const author =
            document.createElement("div");

        author.className =
            "message-author";

        author.textContent =
            message.role === "player"
                ? game.oc.name
                : "Narrator";

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            message.content;

        row.appendChild(author);
        row.appendChild(content);

        container.appendChild(row);

    });

    container.scrollTop =
        container.scrollHeight;

}


/* ============================================================
   SAVE GAME
============================================================ */

async function saveGame(manual = false) {

    if (!game) return false;

    if (!currentUser) {

        setSaveStatus(
            "Not logged in"
        );

        return false;
    }

    /*
       IMPORTANT:
       Always take the authenticated user's ID directly
       from Supabase instead of trusting an old game object.
    */

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

        setSaveStatus(
            "Session expired"
        );

        return false;
    }

    currentUser = user;

    game.user_id = user.id;

    game.updated_at =
        new Date().toISOString();

    const saveData = {

        id: game.id,

        user_id: user.id,

        name: game.name,

        book: game.book,

        location: game.location,

        timeline: game.timeline,

        oc: game.oc,

        memory: game.memory,

        relationships:
            game.relationships,

        inventory:
            game.inventory,

        world_state:
            game.world_state,

        conversation:
            game.conversation,

        versions:
            game.versions,

        created_at:
            game.created_at,

        updated_at:
            game.updated_at

    };

    setSaveStatus("Saving...");

    const {
        error
    } = await supabaseClient
        .from("saved_games")
        .upsert(
            saveData,
            {
                onConflict: "id"
            }
        );

    if (error) {

        console.error(
            "SAVE ERROR:",
            error
        );

        setSaveStatus(
            "Save failed"
        );

        if (manual) {

            alert(
                "Save failed:\n\n" +
                error.message
            );

        }

        return false;
    }

    setSaveStatus(
        manual
            ? "Saved successfully"
            : "Saved"
    );

    return true;

}


function setSaveStatus(text) {

    const element =
        document.getElementById(
            "saveStatus"
        );

    if (element) {

        element.textContent = text;

    }

}


/* ============================================================
   LOAD SAVE LIST
============================================================ */

async function loadSaveList() {

    const list =
        document.getElementById("saveList");

    list.innerHTML =
        "<p>Loading saves...</p>";

    if (!currentUser) {

        list.innerHTML =
            "<p>You are not logged in.</p>";

        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("saved_games")
        .select("*")
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "updated_at",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(error);

        list.innerHTML =
            `<p>Could not load saves: ${escapeHtml(error.message)}</p>`;

        return;
    }

    if (!data || data.length === 0) {

        list.innerHTML =
            "<p>No saved games yet.</p>";

        return;
    }

    list.innerHTML = "";

    data.forEach(save => {

        const card =
            document.createElement("div");

        card.className =
            "save-card";

        const info =
            document.createElement("div");

        info.className =
            "save-info";

        const title =
            document.createElement("h3");

        title.textContent =
            save.name || "Unnamed Character";

        const book =
            document.createElement("p");

        book.textContent =
            save.book;

        const date =
            document.createElement("p");

        date.textContent =
            "Last saved: " +
            new Date(
                save.updated_at
            ).toLocaleString();

        info.appendChild(title);
        info.appendChild(book);
        info.appendChild(date);

        const actions =
            document.createElement("div");

        actions.className =
            "save-actions";

        const loadButton =
            document.createElement("button");

        loadButton.className =
            "small-btn";

        loadButton.textContent =
            "LOAD";

        loadButton.onclick =
            () => loadGame(save.id);

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "small-btn";

        deleteButton.textContent =
            "DELETE";

        deleteButton.onclick =
            () => deleteGame(save.id);

        actions.appendChild(loadButton);
        actions.appendChild(deleteButton);

        card.appendChild(info);
        card.appendChild(actions);

        list.appendChild(card);

    });

}


/* ============================================================
   LOAD GAME
============================================================ */

async function loadGame(id) {

    const {
        data,
        error
    } = await supabaseClient
        .from("saved_games")
        .select("*")
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .single();

    if (error) {

        alert(
            "Could not load game:\n\n" +
            error.message
        );

        return;
    }

    game = {

        id: data.id,

        user_id: data.user_id,

        name: data.name,

        book: data.book,

        location: data.location,

        timeline: data.timeline,

        oc: data.oc || {},

        memory: data.memory || [],

        relationships:
            data.relationships || {},

        inventory:
            data.inventory || [],

        world_state:
            data.world_state || {},

        conversation:
            data.conversation || [],

        versions:
            data.versions || [],

        created_at:
            data.created_at,

        updated_at:
            data.updated_at

    };

    renderGame();

    showScreen("rpScreen");

}


/* ============================================================
   DELETE GAME
============================================================ */

async function deleteGame(id) {

    const confirmed =
        confirm(
            "Delete this saved game permanently?"
        );

    if (!confirmed) return;

    const {
        error
    } = await supabaseClient
        .from("saved_games")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "user_id",
            currentUser.id
        );

    if (error) {

        alert(
            "Could not delete save:\n\n" +
            error.message
        );

        return;
    }

    await loadSaveList();

}


/* ============================================================
   MEMORY
============================================================ */

function showMemory() {

    if (!game) return;

    const content =
        document.getElementById(
            "memoryContent"
        );

    if (
        !game.memory ||
        game.memory.length === 0
    ) {

        content.innerHTML =
            "<p>No important memories have been recorded yet.</p>";

    } else {

        content.innerHTML =
            game.memory
                .map(item =>
                    `<p>${escapeHtml(item)}</p>`
                )
                .join("");

    }

    document
        .getElementById("memoryModal")
        .classList.remove("hidden");

}


function closeMemory() {

    document
        .getElementById("memoryModal")
        .classList.add("hidden");

}


/* ============================================================
   WORD COUNT
============================================================ */

function updateWordCount() {

    const text =
        document.getElementById(
            "playerInput"
        ).value.trim();

    const count =
        text
            ? text.split(/\s+/).length
            : 0;

    document.getElementById(
        "wordCount"
    ).textContent = count;

}


/* ============================================================
   EXIT
============================================================ */

async function exitGame() {

    if (game) {

        await saveGame(false);

    }

    game = null;

    showHome();

}


/* ============================================================
   HELPERS
============================================================ */

function showCreatorMessage(message) {

    document.getElementById(
        "creatorMessage"
    ).textContent = message;

}


function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================================
   AUTOSAVE
============================================================ */

setInterval(
    async () => {

        if (
            game &&
            currentUser &&
            !document
                .getElementById("rpScreen")
                .classList
                .contains("hidden")
        ) {

            await saveGame(false);

        }

    },
    30000
);


/* ============================================================
   KEYBOARD
============================================================ */

document
    .getElementById("playerInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                event.ctrlKey
            ) {

                event.preventDefault();

                sendResponse();

            }

        }
    );

</script>
